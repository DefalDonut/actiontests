name: Tehtävä 1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  container-job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: First step
        id: first
        run: |
          npm ci
          npm test -- test1 > testi1.txt || true
      - name: Second step
        id: second
        run: npm test -- test2 > testi2.txt
      - name: Push into git
        if: failure() || success()
        id: push
        run: |
          git config --global user.name 'DefalDonut'
          git config --global user.email 'tsaily24@students.oamk.fi'
          git add .
          git commit -m "File created" || true
          git push
      - name: tests failed
        continue-on-error: true
        run: echo "Testit epäonnistuivat"
