name: artifact
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          touch log.txt
          echo "Hello world!" > log.txt
      - uses: actions/upload-artifact@v7
        with:
          name: loggaus
          path: ./log.txt
  another-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: loggaus
      - run: touch log.txt
